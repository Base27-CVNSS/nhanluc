name: Sync official Vinh Long dossier

# v4: write an early marker, then sync and commit diagnostics/partial files.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync_official_docs.py"
      - ".github/workflows/sync-official-docs.yml"

permissions:
  contents: write

concurrency:
  group: sync-vinh-long-dossier
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record workflow start
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'GitHub Actions sync started at %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > ACTION_STARTED.txt
          git add ACTION_STARTED.txt
          git commit -m "ci: record dossier sync start" || true
          git push || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pypdf python-docx
          python -m playwright install --with-deps chromium

      - name: Download official files and extract searchable text
        id: sync
        continue-on-error: true
        run: python scripts/sync_official_docs.py

      - name: Commit sync result, including diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files text sync_report.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No sync output to commit."
          else
            git commit -m "chore: sync Vinh Long dossier and diagnostics"
            git push
          fi

      - name: Verify complete dossier
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('sync_report.json')
          if not p.exists():
              raise SystemExit('sync_report.json was not produced')
          r=json.loads(p.read_text(encoding='utf-8'))
          print(f"Downloaded: {r.get('downloaded')}/{r.get('expected')}")
          if r.get('downloaded') != 18:
              raise SystemExit('Official sync is incomplete; inspect sync_report.json')
          PY
