name: Sync official Vinh Long dossier

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install text-extraction dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf python-docx

      - name: Download and verify all 18 official documents
        run: python scripts/sync_official_docs.py

      - name: Verify complete dossier
        run: |
          test "$(find files -maxdepth 1 -type f | wc -l)" -eq 18
          test "$(find text -maxdepth 1 -type f -name '*.txt' | wc -l)" -eq 18
          python - <<'PY'
          import json
          report=json.load(open('sync_report.json',encoding='utf-8'))
          assert report['downloaded'] == 18, report
          assert not report['failures'], report
          print('Verified: 18/18 official files and 18 searchable text files')
          PY

      - name: Commit synchronized dossier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files text sync_report.json
          if git diff --cached --quiet; then
            echo "Official dossier is already current."
          else
            git commit -m "data: synchronize 18 official Vinh Long dossier files"
            git push origin HEAD:main
          fi
