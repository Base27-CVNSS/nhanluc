name: Sync final Resolution 47/2026/NQ-HDND

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync_final_resolution.py"
      - ".github/workflows/sync-final-resolution.yml"
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: sync-final-resolution-47-2026
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'issues' || github.event.issue.title == '[sync] Resolution 47/2026/NQ-HDND'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Discover and download official Resolution 47/2026/NQ-HDND
        id: sync
        continue-on-error: true
        run: python scripts/sync_final_resolution.py

      - name: Commit PDF or source diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add van-ban-chinh-thuc/47_2026_NQ_HDND.pdf van-ban-chinh-thuc/47_2026_NQ_HDND.metadata.json van-ban-chinh-thuc/source_diagnostic.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new PDF or diagnostics to commit."
          else
            git commit -m "data: sync Resolution 47 source and diagnostics"
            git push origin HEAD:main
          fi

      - name: Verify PDF
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('van-ban-chinh-thuc/47_2026_NQ_HDND.pdf')
          if not p.exists():
              raise SystemExit('Resolution PDF is not available; inspect van-ban-chinh-thuc/source_diagnostic.json')
          assert p.read_bytes()[:5] == b'%PDF-'
          print(f'Verified {p} ({p.stat().st_size} bytes)')
          PY
