name: Diagnose Vinh Long document group 18725

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event_name != 'issues' || github.event.issue.title == '[diag] group 18725'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch attachment group 18725
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from html.parser import HTMLParser
          from pathlib import Path

          url='https://hopkhonggiay.vinhlong.dcs.vn/Pages/Frontend/Mobile/LoadDanhSachChiaSeTaiLieu.aspx?pageId=1&pageSize=50&IDLichHop=16834'
          data=urllib.parse.urlencode({
            'tenFile':'','nhomFileID':'18725','isVaiTroChuanBi':'false','isVaiTroKiemDuyet':'false'
          }).encode()
          req=urllib.request.Request(url,data=data,headers={
            'User-Agent':'Mozilla/5.0 Chrome/150 Safari/537.36',
            'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8',
            'X-Requested-With':'XMLHttpRequest',
            'Referer':'https://hopkhonggiay.vinhlong.dcs.vn/Pages/Qr.aspx?Id=16834'
          })
          with urllib.request.urlopen(req,timeout=60) as r:
            raw=r.read(); final=r.geturl(); headers=dict(r.headers)
          text=raw.decode('utf-8','replace')
          Path('diagnostics/group18725.html').write_text(text,encoding='utf-8')

          class P(HTMLParser):
            def __init__(self): super().__init__(); self.links=[]; self.cur=None; self.buf=[]
            def handle_starttag(self,tag,attrs):
              if tag.lower()=='a':
                d=dict(attrs); self.cur={'href':d.get('href',''),'onclick':d.get('onclick',''),'title':d.get('title',''),'text':''}; self.buf=[]
            def handle_data(self,data):
              if self.cur is not None:self.buf.append(data)
            def handle_endtag(self,tag):
              if tag.lower()=='a' and self.cur is not None:
                self.cur['text']=' '.join(''.join(self.buf).split()); self.links.append(self.cur); self.cur=None; self.buf=[]
          p=P(); p.feed(text)
          urls=sorted(set(re.findall(r'''(?:https?://[^\"'<>\s]+|/[^\"'<>\s]+(?:\.pdf|\.docx|DownloadFileByURL|ProcessAPIRequest)[^\"'<>\s]*)''',text,re.I)))
          report={'url':url,'final_url':final,'bytes':len(raw),'links':p.links,'urls':urls,'html_preview':text[:12000]}
          Path('diagnostics/group18725.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('bytes',len(raw),'links',len(p.links),'urls',len(urls))
          PY

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/group18725.*
          git commit -m "ci: inspect document group 18725" || true
          git push origin HEAD:main || true
